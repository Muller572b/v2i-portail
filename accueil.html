<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2I Portail - Accueil</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; letter-spacing: -0.01em; }
    </style>
</head>
<body class="bg-[#f5f5f7] min-h-screen text-[#1d1d1f] antialiased">

    <nav class="bg-white border-b border-[#e8e8ed] sticky top-0 z-50 h-14 flex items-center">
        <div class="max-w-7xl mx-auto px-6 w-full flex justify-between items-center">
            
            <div class="flex items-center gap-3">
                <span class="font-bold text-lg tracking-tight text-[#1d1d1f]">
                    V2I <span class="text-[#0066cc]">Optique</span>
                </span>
                <span id="store-name" class="bg-[#e2f1ff] text-[#0066cc] text-xs px-3 py-1 rounded-full font-medium border border-[#bfe0ff]/30">
                    Chargement...
                </span>
            </div>
            
            <div class="hidden md:flex items-center gap-6">
                <a href="accueil.html" class="bg-[#e2f1ff] text-[#0066cc] px-3 py-1 rounded-full text-sm font-medium no-underline">
                    Accueil
                </a>
                <a href="suivi.html" class="text-[#86868b] hover:text-[#1d1d1f] text-sm font-medium no-underline transition-colors">
                    Suivi
                </a>
                <a href="documents.html" class="text-[#86868b] hover:text-[#1d1d1f] text-sm font-medium no-underline transition-colors">
                    Documents
                </a>
                <button onclick="logout()" class="text-[#86868b] hover:text-[#ff3b30] flex items-center gap-1 text-sm font-medium cursor-pointer transition-colors border-0 bg-transparent">
                    <i data-lucide="log-out" class="w-4 h-4 stroke-[1.5]"></i> Déconnexion
                </button>
            </div>

        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 pt-20">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
            
            <a href="suivi.html" class="flex flex-col items-center justify-center p-12 bg-white border border-[#e8e8ed] rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.01)] hover:shadow-[0_12px_30px_rgba(0,0,0,0.03)] hover:scale-[1.01] transition-all text-center group cursor-pointer no-underline min-h-[180px]">
                <div class="text-[#0066cc] mb-4 group-hover:scale-105 transition-transform">
                    <i data-lucide="box" class="w-10 h-10 stroke-[1.5]"></i>
                </div>
                <span class="text-base font-semibold text-[#1d1d1f]">Suivi de commande</span>
            </a>

            <a href="documents.html" class="flex flex-col items-center justify-center p-12 bg-white border border-[#e8e8ed] rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.01)] hover:shadow-[0_12px_30px_rgba(0,0,0,0.03)] hover:scale-[1.01] transition-all text-center group cursor-pointer no-underline min-h-[180px]">
                <div class="text-[#af52de] mb-4 group-hover:scale-105 transition-transform">
                    <i data-lucide="file-text" class="w-10 h-10 stroke-[1.5]"></i>
                </div>
                <span class="text-base font-semibold text-[#1d1d1f]">Documents</span>
            </a>

        </div>
    </main>

    <script src="accueil.js"></script>
</body>
</html>
