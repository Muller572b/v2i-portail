<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2i Portail - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="accueil.js" defer></script>
</head>
<body class="bg-[#f5f5f7] text-[#1d1d1f] font-sans antialiased min-h-screen flex">

    <aside class="w-64 bg-white border-r border-[#e8e8ed] flex flex-col justify-between">
        <div class="p-6">
            <!-- Logo ajouté ici -->
            <div class="mb-8 flex items-center gap-3">
                <img src="images/logov2i.png" alt="Logo V2I" class="w-8 h-8 object-contain">
                <h1 class="text-xl font-bold tracking-tight text-[#1d1d1f]">V2I OPTIQUE</h1>
            </div>
            
            <nav class="space-y-2">
                <a href="accueil.html" class="flex items-center gap-3 px-4 py-3 bg-[#f5f5f7] text-[#0066cc] font-semibold rounded-xl">
                    <i data-lucide="home" class="w-5 h-5"></i> Accueil
                </a>
                <a href="suivi.html" class="flex items-center gap-3 px-4 py-3 text-[#86868b] hover:bg-[#f5f5f7] hover:text-[#1d1d1f] font-medium rounded-xl transition-colors">
                    <i data-lucide="list" class="w-5 h-5"></i> Suivi Commandes
                </a>
                <a href="documents.html" class="flex items-center gap-3 px-4 py-3 text-[#86868b] hover:bg-[#f5f5f7] hover:text-[#1d1d1f] font-medium rounded-xl transition-colors">
                    <i data-lucide="folder" class="w-5 h-5"></i> Documents
                </a>
            </nav>
        </div>
        <div class="p-6 border-t border-[#e8e8ed]">
            <button onclick="logout()" class="flex items-center justify-center w-full gap-2 px-4 py-2.5 text-[#ff3b30] bg-[#ff3b30]/10 hover:bg-[#ff3b30]/20 font-semibold rounded-xl transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i> Déconnexion
            </button>
        </div>
    </aside>

    <main class="flex-1 p-10">
        <header class="mb-10">
            <h2 class="text-3xl font-bold tracking-tight">Tableau de bord</h2>
            <p id="store-name" class="text-[#86868b] mt-1 font-medium">Chargement du magasin...</p>
        </header>

        <div class="space-y-6">
            <!-- Carré de bienvenue conservé -->
            <div class="bg-white p-6 rounded-2xl border border-[#e8e8ed] shadow-sm max-w-2xl">
                <h3 class="text-lg font-semibold mb-2">Bienvenue sur votre espace V2i</h3>
                <p class="text-[#86868b] text-sm">Utilisez le menu de gauche pour naviguer vers le suivi de vos commandes de verres ou consulter la bibliothèque de documents techniques.</p>
            </div>

            <!-- Image ajoutée en dessous -->
            <div class="rounded-2xl overflow-hidden border border-[#e8e8ed] shadow-sm">
                <img src="images/v2iaccueil.jpg" alt="V2i Industrie Insulaire" class="w-full h-auto object-cover">
            </div>
        </div>
    </main>

    <script>
        // Initialisation des icônes Lucide
        lucide.createIcons();
    </script>
</body>
</html>
