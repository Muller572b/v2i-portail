name: "Déploiement Automatique du Portail"

on:
  push:
    branches: ["main", "beta"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération de la Production (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Récupération des fichiers de Test (beta)
        uses: actions/checkout@v4
        with:
          ref: beta
          path: temp_beta

      # --- DIAGNOSTIC : POUR VOIR LE POIDS DE CHAQUE DOSSIER ---
      - name: Diagnostic de la taille des dossiers
        run: |
          echo "========================================="
          echo "=== ANALYSE DU POIDS DE CHAQUE DOSSIER ==="
          echo "========================================="
          du -sh */ 2>/dev/null || true
          echo "========================================="

      # --- ETAPE 1 : CONFIGURATION ET EXECUTION PYTHON ---
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: pip install beautifulsoup4 requests

      - name: Récupération des actualités
        run: |
          if [ -f "fluxactu.py" ]; then
            python fluxactu.py
          fi

      - name: Génération de l'index des documents
        run: |
          if [ -f "scannerdocumentdispo.py" ]; then
            python scannerdocumentdispo.py
          fi

      # --- ETAPE 2 : ASSEMBLEMENT DU DOSSIER PUBLIC ---
      - name: Construction dynamique de l'espace de Production et Beta
        run: |
          # 1. Créer le dossier final qui sera envoyé sur le web
          mkdir -p public

          # 2. Y copier la production (Fichiers web + JSON générés uniquement)
          cp *.html public/ 2>/dev/null || true
          cp *.js public/ 2>/dev/null || true
          cp *.css public/ 2>/dev/null || true
          cp *.json public/ 2>/dev/null || true
          cp -r data_magasins public/ 2>/dev/null || true
          cp -r cartedevue public/ 2>/dev/null || true

          # 3. Construire l'espace Beta à l'intérieur du dossier public
          mkdir -p public/beta
          cp -r temp_beta/* public/beta/ 2>/dev/null || true
          
          # Nettoyage complet des dossiers inutiles/historiques de la beta
          rm -rf public/beta/data_magasins public/beta/data_archives public/beta/eBLCertifie public/beta/cartedevue public/beta/documentcommun public/beta/documents_magasin public/beta/.github public/beta/.git
          
          # Liens des données et documents pour la beta
          cp *.json public/beta/ 2>/dev/null || true
          cp -r data_magasins public/beta/ 2>/dev/null || true
          cp -r cartedevue public/beta/ 2>/dev/null || true
          cp -r documentcommun public/beta/ 2>/dev/null || true
          
          # Supprimer le dossier temporaire brut de la beta
          rm -rf temp_beta

      # --- ETAPE 3 : DEPLOIEMENT ---
      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v4

      - name: Téléchargement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
