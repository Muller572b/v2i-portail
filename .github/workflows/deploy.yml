name: "Déploiement Automatique du Portail"

on:
  push:
    branches: ["main", "beta"]
  schedule:
    - cron: '11 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-pdf:
    runs-on: ubuntu-latest
    # On exécute la synchro PDF à chaque fois (push ou schedule)
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v4
      - name: Transfert des PDF vers portail-cartedevue
        env:
          TOKEN: ${{ secrets.MES_PDF_TOKEN }}
        run: |
          git config --global user.email "bot@v2i.fr"
          git config --global user.name "Bot Transfert"
          git clone https://x-access-token:$TOKEN@github.com/Muller572b/portail-cartedevue.git temp_sync
          cp -r cartedevue/* temp_sync/
          cd temp_sync
          git add .
          git commit -m "Sync auto des PDF [skip ci]" || echo "Rien à commettre"
          git push origin main
          cd ..
          rm -rf temp_sync

  deploy:
    needs: sync-pdf
    # Le déploiement Web se lance lors d'un push OU d'un test manuel, mais PAS au schedule
    if: github.event_name != 'schedule'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération de la Production (main)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Récupération des fichiers de Test (beta)
        uses: actions/checkout@v4
        with:
          ref: beta
          path: temp_beta
      # ... (RESTE DU CODE INCHANGÉ JUSQU'À LA FIN)
