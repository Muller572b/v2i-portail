name: "Déploiement Automatique du Portail"

on:
  push:
    branches: ["main", "beta"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupération de la Production (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Récupération des fichiers de Test (beta)
        uses: actions/checkout@v4
        with:
          ref: beta
          path: temp_beta

      - name: Construction dynamique de l'espace Beta
        run: |
          mkdir -p beta
          cp -r temp_beta/* beta/ 2>/dev/null || true
          rm -rf beta/data_magasins beta/data_archives beta/eBLCertifie beta/cartedevue beta/.github
          cp -r data_magasins beta/ 2>/dev/null || true
          cp -r data_archives beta/ 2>/dev/null || true
          cp -r eBLCertifie beta/ 2>/dev/null || true
          cp -r cartedevue beta/ 2>/dev/null || true
          rm -rf temp_beta

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: pip install beautifulsoup4 requests

      - name: Récupération des actualités
        run: |
          if [ -f "fluxactu.py" ]; then
            echo "→ Exécution de fluxactu.py depuis la racine..."
            python fluxactu.py
          elif [ -f "beta/fluxactu.py" ]; then
            echo "→ fluxactu.py trouvé dans beta, copie et exécution..."
            cp beta/fluxactu.py .
            python fluxactu.py
          else
            echo "⚠ fluxactu.py introuvable. Création d'un flux vide de sécurité."
            mkdir -p data beta/data 2>/dev/null || true
            echo "[]" > data/flux_optique.json
            echo "[]" > beta/data/flux_optique.json
          fi

      - name: Génération de l'index des documents
        run: |
          if [ -f "scannerdocumentdispo.py" ]; then
            echo "→ Exécution de scannerdocumentdispo.py depuis la racine..."
            python scannerdocumentdispo.py
          elif [ -f "beta/scannerdocumentdispo.py" ]; then
            echo "→ scannerdocumentdispo.py trouvé dans beta, copie et exécution..."
            cp beta/scannerdocumentdispo.py .
            python scannerdocumentdispo.py
          else
            echo "⚠ scannerdocumentdispo.py introuvable. Étape ignorée."
          fi

      - name: Configuration de GitHub Pages
        uses: actions/configure-pages@v4

      - name: Téléchargement de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
