<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#f5f5f7]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V2I Portail - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full text-[#1d1d1f] flex flex-col antialiased">

    <div id="login-screen" class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 bg-gradient-to-b from-[#f5f5f7] to-[#e8e8ed]">
        <div class="sm:mx-auto w-full max-w-md">
            <div class="flex justify-center">
                <div class="p-3 bg-white rounded-2xl shadow-sm border border-[#e8e8ed]">
                    <svg class="w-10 h-10 text-[#0066cc]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/>
                    </svg>
                </div>
            </div>
            <h2 class="mt-6 text-center text-2xl font-bold tracking-tight text-[#1d1d1f]">V2I Portail</h2>
            <p class="mt-2 text-center text-sm text-[#86868b]">Accédez à votre espace laboratoire partenaire</p>
        </div>

        <div class="mt-8 sm:mx-auto w-full max-w-md">
            <div class="bg-white py-8 px-4 shadow-sm border border-[#e8e8ed] sm:rounded-2xl sm:px-10">
                <form class="space-y-6" onsubmit="handleLogin(event)">
                    <div>
                        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-[#86868b]">N° Identifiant Client</label>
                        <div class="mt-1.5">
                            <input id="username" type="text" required placeholder="Ex: 12345" class="block w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none focus:border-[#0066cc] focus:ring-1 focus:ring-[#0066cc]">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-[#86868b]">Code Cosium (Mot de passe)</label>
                        <div class="mt-1.5">
                            <input id="password" type="password" required placeholder="••••••••" class="block w-full rounded-xl border border-gray-300 px-4 py-3 text-sm outline-none focus:border-[#0066cc] focus:ring-1 focus:ring-[#0066cc]">
                        </div>
                    </div>

                    <div id="login-error" class="hidden text-xs font-medium text-red-600 bg-red-50 border border-red-100 p-3 rounded-xl"></div>

                    <button type="submit" class="flex w-full justify-center rounded-xl bg-[#0066cc] px-4 py-3 text-sm font-semibold text-white shadow hover:bg-[#0055aa] transition-all cursor-pointer">
                        Se connecter
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
